services:
  - type: web
    name: fin-news-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python nltk_setup.py
    startCommand: uvicorn main:app --host=0.0.0.0 --port=10000
    envVars:
      # Set these in the Render dashboard; sync: false keeps values out of git.
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ai-financial-news-summarizer.vercel.app
